version: '3.8'

services:
  app:
    # Build Local: O Portainer reconstruirá a imagem via Git a partir desta pasta
    build:
      context: .
    # Nome opcional. Removido ou configurado pelo Portainer para evitar conflitos
    # container_name: mailforge_app
    
    # Configuração de Portas (Ex: 8098 externa redireciona para a 3000 interna)
    ports:
      - "8098:3000"
      
    # Rede Isolada (bridge)
    networks:
      - mailforge_network
      
    # Persistência de Dados (Bind Mount para a pasta ./data no servidor host)
    volumes:
      - ./data:/app/data
      
    # Variáveis de Ambiente
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/mailforge.db
      - PORT=3000
      
    # Restart Policy
    restart: unless-stopped

# Criação da Rede Interna (bridge)
networks:
  mailforge_network:
    driver: bridge
